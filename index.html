<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nightglass File System</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="256x256" href="icons/icon-256.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<script type="application/json" id="claude-artifacts-manifest">{"permissions": ["full-access"]}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=JetBrains+Mono:wght@400;700&family=Source+Code+Pro:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* VOICE a faithful Midnight Commander: dense, keyboard-first, nothing extra
   IDEA the text-mode two-panel file manager, drawn with CSS instead of a terminal
   PICTURE the two panels themselves, double-line frames, cursor bar, function-key bar
   COLOUR classic skin: DOS blue, light grey, cyan bar, yellow marks; Nightglass skin: black, phosphor green, cyan, red
   TYPE IBM Plex Mono (classic), Share Tech Mono (Nightglass), one size, 20px rows
   LAYOUT menubar / two panels / hint / command line / F-key bar; one panel at a time below 640px */
body{--bg:#0000a8;--fg:#b8b8b8;--dir:#fff;--fr:#b8b8b8;--cb:#00a8a8;--cf:#000;--mk:#fcfc54;--ct:#fcfc54;--hd:#fcfc54;--bb:#00a8a8;--bf:#000;--sb:#000;--sf:#fff;--kb:#000;--kf:#b8b8b8;--lb:#000;--lf:#b8b8b8;--db:#b8b8b8;--df:#000;--dr:#000;--eb:#a80000;--ef:#fff;--ib:#00a8a8;--if:#000;--font:"IBM Plex Mono",Consolas,"DejaVu Sans Mono",monospace}
:root{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{display:grid;grid-template-rows:20px minmax(0,1fr) 20px 22px auto;background:var(--bg);color:var(--fg);font:15px/20px var(--font);overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;line-height:inherit}
button:focus-visible{outline:1px dotted currentColor;outline-offset:-1px}
#mb{display:flex;background:var(--bb);color:var(--bf);white-space:pre;overflow:hidden}
#mb button{padding:0 1.5ch}
#mb button.on{background:var(--sb);color:var(--sf)}
#mb .mode{margin-left:auto;padding:0 1ch;opacity:.85}
#work{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:0}
.pn{position:relative;border:3px double var(--fr);display:flex;flex-direction:column;min-height:0;margin-top:9px;padding-top:7px}
.ttl{position:absolute;top:-10px;line-height:16px;left:50%;transform:translateX(-50%);max-width:calc(100% - 4ch);background:var(--bg);color:var(--fg);white-space:pre;overflow:hidden;text-overflow:ellipsis;direction:rtl;padding:0}
.ttl span{direction:ltr;unicode-bidi:embed}
.pn.act .ttl{background:var(--cb);color:var(--cf)}
.cols,.row{display:grid;grid-template-columns:minmax(0,1fr) 9ch 13ch;white-space:pre}
.cols{color:var(--hd);text-align:center;font-weight:600}
.cols button{text-align:center;overflow:hidden}
.rows{flex:1;min-height:0;overflow:hidden;position:relative}
.cols,.rows{background:linear-gradient(var(--fr),var(--fr)) no-repeat right 22ch top/1px 100%,linear-gradient(var(--fr),var(--fr)) no-repeat right 13ch top/1px 100%}
.row{height:20px;cursor:default}
.row span{overflow:hidden;text-overflow:clip}
.c1{padding-left:1px}
.c2{text-align:right;padding-right:.5ch}
.c3{padding-left:1ch}
.row.d{color:var(--dir);font-weight:600}
.row.t{color:var(--mk);font-weight:600}
.row.cur{background:var(--cb);color:var(--cf)}
.row.cur.t{color:var(--ct);background:var(--cb)}
body[data-skin=neon] .row.d,body[data-skin=neon] .cols,body[data-skin=neon] #mb{text-shadow:0 0 6px currentColor}
body[data-skin=neon] .pn{box-shadow:0 0 12px rgba(255,126,219,.35),inset 0 0 12px rgba(255,126,219,.12)}
body[data-skin=neon] .row.cur{box-shadow:0 0 12px #ff7edb}
.mini{border-top:1px solid var(--fr);height:21px;display:flex;justify-content:space-between;gap:2ch;padding:0 .5ch;white-space:pre;overflow:hidden}
.mini span:first-child{overflow:hidden;text-overflow:ellipsis}
.mini .mk{color:var(--mk);font-weight:600}
#hint{white-space:pre;overflow:hidden;text-overflow:ellipsis;padding:0 1ch}
#hint button{text-decoration:underline;color:var(--dir)}
#cl{display:flex;background:var(--lb);color:var(--lf);white-space:pre;align-items:center}
#prompt{overflow:hidden;text-overflow:ellipsis;max-width:55%;padding-left:.5ch}
#cmd{flex:1;background:none;border:0;outline:0;color:inherit;font:16px/22px var(--font);padding:0;caret-color:var(--lf);user-select:text;-webkit-user-select:text}
#fn{display:flex;flex-wrap:nowrap;background:var(--kb);white-space:pre;overflow:hidden}
#fn button{flex:1 1 0;display:flex;min-width:0;text-align:left}
#fn b{color:var(--kf);font-weight:400;padding:0 .2ch 0 .6ch}
#fn span{flex:1;background:var(--bb);color:var(--bf);overflow:hidden;min-height:20px}
#fn .tabk{display:none}
#ov{position:absolute;inset:0;background:var(--bg);display:none;grid-template-rows:20px minmax(0,1fr);z-index:5}
body.ov #ov{display:grid}
body.ov #hint,body.ov #cl,body.term #hint,body.term #cl{display:none}
body.ov,body.term{grid-template-rows:20px minmax(0,1fr) auto}
#con{position:absolute;inset:0;background:var(--tb,#000);color:var(--fg);display:none;z-index:6;overflow:auto;padding:2px 1ch;white-space:pre-wrap;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
body[data-skin=classic] #con{color:#c0c0c0}
#con .c{color:var(--dir);font-weight:600}
#con .e{color:#e5484d}
body.con #con{display:block}
body.con #hint{display:none}
body.con{grid-template-rows:20px minmax(0,1fr) 22px auto}
#ovt{background:var(--bb);color:var(--bf);white-space:pre;overflow:hidden;text-overflow:ellipsis;padding:0 1ch;display:flex;gap:3ch}
#ovt span:first-child{flex:1;overflow:hidden;text-overflow:ellipsis}
#ovb{overflow:auto;min-height:0;user-select:text;-webkit-user-select:text}
#ovb:focus{outline:0}
#ovb pre{margin:0;padding:0 1ch;font:inherit;white-space:pre}
#ovb pre.w{white-space:pre-wrap;overflow-wrap:anywhere}
#ovb img{display:block;max-width:calc(100% - 2ch);margin:1ch;image-rendering:auto;background:repeating-conic-gradient(#888 0 25%,#ccc 0 50%) 0 0/16px 16px}
#ovb textarea{width:100%;height:100%;display:block;resize:none;border:0;outline:0;background:var(--bg);margin:0;color:var(--fg);font:15px/20px var(--font);padding:0 1ch;tab-size:8;caret-color:var(--fg);white-space:pre;overflow:auto}
#dd{position:absolute;top:20px;z-index:30;background:var(--bb);color:var(--bf);border:3px double var(--bf);padding:2px 0;box-shadow:2ch 20px 0 rgba(0,0,0,.55);display:none;min-width:26ch}
#dd.on{display:block}
#dd button{display:flex;justify-content:space-between;gap:3ch;width:100%;padding:0 1ch;white-space:pre;text-align:left}
#dd button.on{background:var(--sb);color:var(--sf)}
#dd button:disabled{opacity:.5;cursor:default}
#dd hr{border:0;border-top:1px solid var(--bf);margin:2px 0}
#dw{position:fixed;inset:0;display:none;place-items:center;z-index:40;padding:16px}
#dw.on{display:grid}
.dlg{background:var(--db);color:var(--df);padding:10px 1.5ch;box-shadow:2ch 20px 0 rgba(0,0,0,.55);width:min(64ch,100%)}
.dlg .fr{border:3px double var(--dr);padding:14px 2ch 10px;position:relative}
.dlg .dt{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--db);padding:0 1ch;white-space:pre;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.dlg p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.dlg input[type=text]{display:block;width:100%;margin:6px 0 2px;background:var(--ib);color:var(--if);border:0;outline:0;font:16px/22px var(--font);padding:0 .5ch;user-select:text;-webkit-user-select:text}
.dlg .db{display:flex;justify-content:center;flex-wrap:wrap;gap:0 2ch;margin-top:12px;white-space:pre}
.dlg .db button{padding:0 .5ch}
.dlg .db button:focus{background:var(--cb);color:var(--cf);outline:0}
.dlg.err{background:var(--eb);color:var(--ef)}
.dlg.err .fr{border-color:var(--ef)}
.dlg.err .dt{background:var(--eb)}
.dlg pre{margin:0;font:inherit;white-space:pre-wrap}
#tm{position:absolute;inset:0;background:var(--tb,#000);display:none;z-index:6;padding:2px 0 0 4px}
body.term #tm{display:block}
.dlg.wide{width:min(112ch,100%)}
.dlg .fl{display:block;margin-top:8px}
.dlg .opts{display:flex;flex-wrap:wrap;gap:6px 3ch;margin-top:8px;align-items:center}
.dlg .opts label{white-space:nowrap}
.dlg .opts input[type=checkbox]{accent-color:var(--cb);width:16px;height:16px;vertical-align:-3px;margin:0 .5ch 0 0}
.dlg .opts input.num{display:inline-block;width:7ch;margin:0 0 0 .5ch}
.dlg select{background:var(--ib);color:var(--if);border:0;font:inherit;margin-left:.5ch;min-height:22px}
.prev{margin-top:10px;height:min(38vh,300px);overflow:auto;background:var(--bg);color:var(--fg);padding:2px 1ch;user-select:text;-webkit-user-select:text}
.pr{display:grid;grid-template-columns:minmax(0,1fr) 3ch minmax(0,1fr) 13ch;white-space:pre}
.pr span{overflow:hidden;text-overflow:ellipsis}
.pr.same{opacity:.55}
.pr.ok span:nth-child(3){color:var(--dir);font-weight:600}
.pr.err{background:var(--eb);color:var(--ef)}
#bm{margin-top:6px}
@media(max-width:700px){.pr{grid-template-columns:minmax(0,1fr) 2ch minmax(0,1fr)}.pr span:nth-child(4){display:none}}
#ovb .pvb{padding:10px 1ch 20px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-height:100%}
.pvb img,.pvb canvas,.qvb img,.qvb canvas{max-width:100%;height:auto;background:repeating-conic-gradient(#999 0 25%,#ccc 0 50%) 0 0/16px 16px;box-shadow:0 0 0 1px var(--fr)}
.pvb canvas,.qvb canvas{background:#fff}
.pvb video,.qvb video{max-width:100%;max-height:70vh}
.pvb audio,.qvb audio{width:min(100%,480px)}
.docf{width:100%;flex:1;min-height:60vh;border:0;background:#fff}
.qvb .docf{min-height:calc(100% - 20px);height:calc(100% - 20px)}
.pvn{color:var(--hd);white-space:pre-wrap}
.pvn.e{color:#e5484d}
#ovb .hx{position:relative}
#ovb .hx pre{position:absolute;left:0;right:0;margin:0}
.hx .ho{color:var(--hd)}
.hx .ch{color:#e5484d;font-weight:700}
.hx .cur{outline:1px solid var(--cb)}
.hx .cur.on{background:var(--cb);color:var(--cf);outline:0}
.hx [data-o]{cursor:text}
.pn .qvb{display:none;flex:1;min-height:0;overflow:auto;padding:4px 1ch;user-select:text;-webkit-user-select:text}
.pn.qv .cols,.pn.qv .rows,.pn.qv .mini{display:none}
.pn.qv .qvb{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.qvb .qvt{margin:0;font:inherit;white-space:pre-wrap;overflow-wrap:anywhere;width:100%}
.row.gm .c1{color:var(--hd)}
.row.gu .c1{opacity:.75;font-style:italic}
.row.cur.gm .c1,.row.cur.gu .c1{color:inherit;opacity:1}
.hl .hljs-keyword,.hl .hljs-selector-tag,.hl .hljs-literal,.hl .hljs-doctag{color:var(--sk)}
.hl .hljs-keyword{font-weight:600}
.hl .hljs-string,.hl .hljs-regexp,.hl .hljs-addition,.hl .hljs-char\.escape_{color:var(--ss)}
.hl .hljs-comment,.hl .hljs-quote{color:var(--sc);font-style:italic}
.hl .hljs-number,.hl .hljs-symbol,.hl .hljs-bullet{color:var(--sn)}
.hl .hljs-title,.hl .hljs-section{color:var(--sf)}
.hl .hljs-type,.hl .hljs-built_in,.hl .hljs-title.class_,.hl .hljs-title.class_.inherited__{color:var(--st)}
.hl .hljs-attr,.hl .hljs-attribute,.hl .hljs-variable,.hl .hljs-template-variable,.hl .hljs-property,.hl .hljs-name,.hl .hljs-selector-class,.hl .hljs-selector-id,.hl .hljs-params{color:var(--sa)}
.hl .hljs-meta,.hl .hljs-tag,.hl .hljs-subst,.hl .hljs-link,.hl .hljs-selector-pseudo{color:var(--sm)}
.hl .hljs-deletion{color:#e5484d}
.hl .hljs-emphasis{font-style:italic}
.hl .hljs-strong{font-weight:700}
#ovb .edw{position:relative;height:100%}
#ovb .edw .hlp{position:absolute;inset:0;margin:0;padding:0 1ch;overflow:hidden;white-space:pre;font:15px/20px var(--font);tab-size:8;color:var(--fg);pointer-events:none;display:none}
#ovb .edw.on .hlp{display:block}
#ovb .edw textarea{position:absolute;inset:0;background:transparent}
#ovb .edw.on textarea{color:transparent;-webkit-text-fill-color:transparent}
#man{position:absolute;inset:0;z-index:9;display:none;background:var(--db);color:var(--df);grid-template-rows:20px auto minmax(0,1fr)}
body.man #man{display:grid}
body.man #hint,body.man #cl{display:none}
body.man{grid-template-rows:20px minmax(0,1fr) auto}
#mant{background:var(--bb);color:var(--bf);padding:0 1ch;white-space:pre;overflow:hidden;text-overflow:ellipsis}
#mans{padding:6px 1.5ch;border-bottom:3px double var(--dr)}
#manq{width:min(100%,60ch);background:var(--ib);color:var(--if);border:0;outline:0;font:16px/24px var(--font);padding:0 .8ch;user-select:text;-webkit-user-select:text}
#manw{display:grid;grid-template-columns:30ch minmax(0,1fr);min-height:0}
#mantoc{overflow:auto;border-right:3px double var(--dr);padding:6px 0}
#mantoc button{display:block;width:100%;text-align:left;padding:1px 1.5ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mantoc button.on{background:var(--cb);color:var(--cf)}
#mantoc button:hover{text-decoration:underline}
#manb{overflow:auto;padding:12px 3ch 48px;user-select:text;-webkit-user-select:text;outline:0}
#manb h2{font:inherit;font-weight:700;margin:0 0 12px;padding-bottom:4px;border-bottom:1px solid var(--dr)}
#manb h3{font:inherit;font-weight:700;margin:18px 0 6px}
#manb p,#manb li{max-width:92ch}
#manb p{margin:0 0 10px}
#manb ul,#manb ol{margin:0 0 12px;padding-left:3ch}
#manb li{margin-bottom:3px}
#manb kbd{background:var(--bb);color:var(--bf);padding:0 .5ch;font:inherit;white-space:nowrap}
#manb code{font:inherit;font-weight:700}
#manb table{border-collapse:collapse;margin:4px 0 14px;max-width:100ch}
#manb td{padding:3px 2ch 3px 0;vertical-align:top;border-bottom:1px dotted var(--dr)}
#manb td:first-child{white-space:nowrap}
#manb pre{background:var(--bg);color:var(--fg);padding:8px 1.5ch;margin:4px 0 12px;white-space:pre;overflow:auto;font:inherit}
#manb .lk{text-decoration:underline;font-weight:700;color:inherit}
#manb .lk:hover,#manb .lk:focus{background:var(--cb);color:var(--cf);outline:0}
#manb .sn{opacity:.8}
@media(max-width:720px){#manw{grid-template-columns:minmax(0,1fr)}#mantoc{display:none}#manb td:first-child{white-space:normal}}
@media(max-width:1100px) and (min-width:640px){.c3{display:none}.cols,.row{grid-template-columns:minmax(0,1fr) 9ch}.cols,.rows{background:linear-gradient(var(--fr),var(--fr)) no-repeat right 9ch top/1px 100%}}
@media(max-width:639px){
 #work{grid-template-columns:minmax(0,1fr)}
 .pn:not(.act){display:none}
 #fn{flex-wrap:wrap}
 #fn button{flex:1 1 15%;margin-bottom:1px}
 #fn .tabk{display:flex}
 #mb button{padding:0 .8ch}
 #mb .mode{display:none}
 #prompt{max-width:45%}
}
@media(max-width:459px){.c3{display:none}.cols,.row{grid-template-columns:minmax(0,1fr) 9ch}.cols,.rows{background:linear-gradient(var(--fr),var(--fr)) no-repeat right 9ch top/1px 100%}}
@media(pointer:coarse){.row{height:28px;line-height:28px}}

/**
 *  Default styles for xterm.js
 */

.xterm {
    cursor: text;
    position: relative;
    user-select: none;
    -ms-user-select: none;
    -webkit-user-select: none;
}

.xterm.focus,
.xterm:focus {
    outline: none;
}

.xterm .xterm-helpers {
    position: absolute;
    top: 0;
    /**
     * The z-index of the helpers must be higher than the canvases in order for
     * IMEs to appear on top.
     */
    z-index: 5;
}

.xterm .xterm-helper-textarea {
    padding: 0;
    border: 0;
    margin: 0;
    /* Move textarea out of the screen to the far left, so that the cursor is not visible */
    position: absolute;
    opacity: 0;
    left: -9999em;
    top: 0;
    width: 0;
    height: 0;
    z-index: -5;
    /** Prevent wrapping so the IME appears against the textarea at the correct position */
    white-space: nowrap;
    overflow: hidden;
    resize: none;
}

.xterm .composition-view {
    /* TODO: Composition position got messed up somewhere */
    background: #000;
    color: #FFF;
    display: none;
    position: absolute;
    white-space: nowrap;
    z-index: 1;
}

.xterm .composition-view.active {
    display: block;
}

.xterm .xterm-viewport {
    /* On OS X this is required in order for the scroll bar to appear fully opaque */
    background-color: #000;
    overflow-y: scroll;
    cursor: default;
    position: absolute;
    right: 0;
    left: 0;
    top: 0;
    bottom: 0;
}

.xterm .xterm-screen {
    position: relative;
}

.xterm .xterm-screen canvas {
    position: absolute;
    left: 0;
    top: 0;
}

.xterm .xterm-scroll-area {
    visibility: hidden;
}

.xterm-char-measure-element {
    display: inline-block;
    visibility: hidden;
    position: absolute;
    top: 0;
    left: -9999em;
    line-height: normal;
}

.xterm.enable-mouse-events {
    /* When mouse events are enabled (eg. tmux), revert to the standard pointer cursor */
    cursor: default;
}

.xterm.xterm-cursor-pointer,
.xterm .xterm-cursor-pointer {
    cursor: pointer;
}

.xterm.column-select.focus {
    /* Column selection mode */
    cursor: crosshair;
}

.xterm .xterm-accessibility:not(.debug),
.xterm .xterm-message {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    right: 0;
    z-index: 10;
    color: transparent;
    pointer-events: none;
}

.xterm .xterm-accessibility-tree:not(.debug) *::selection {
  color: transparent;
}

.xterm .xterm-accessibility-tree {
  user-select: text;
  white-space: pre;
}

.xterm .live-region {
    position: absolute;
    left: -9999px;
    width: 1px;
    height: 1px;
    overflow: hidden;
}

.xterm-dim {

.xterm-underline-1 { text-decoration: underline; }
.xterm-underline-2 { text-decoration: double underline; }
.xterm-underline-3 { text-decoration: wavy underline; }
.xterm-underline-4 { text-decoration: dotted underline; }

.xterm-overline.xterm-underline-1 { text-decoration: overline underline; }

.xterm-overline.xterm-underline-3 { text-decoration: overline wavy underline; }

function norm(p){p=String(p).replace(/\\/g,'/');let root='/',rest;const m=p.match(/^([A-Za-z]:)(\/|$)/);if(m){root=m[1].toUpperCase()+'/';rest=p.slice(m[0].length)}else rest=p.replace(/^\/+/,'');const o=[];for(const s of rest.split('/')){if(!s||s==='.')continue;if(s==='..')o.pop();else o.push(s)}return root+o.join('/')}

{id:'move',t:'Muoversi',b:tbl([[kb('↑','↓'),'file precedente o successivo'],[kb('PgUp','PgDn'),'una pagina in su o in giù'],[kb('Home','End'),'primo o ultimo file (a riga di comando vuota; con testo scritto usa Ctrl-Home e Ctrl-End)'],[kb('Invio'),'entra nella cartella, apre l\'archivio; su un file: lo apre nella sua app (disco vero) o lo visualizza (disco demo)'],[kb('Tab'),'passa all\'altro pannello'],[kb('Ctrl-U'),'scambia i due pannelli'],[kb('Alt-I'),'mostra nell\'altro pannello la stessa cartella'],[kb('Ctrl-R'),'rilegge le cartelle'],[kb('Alt-Invio'),'copia il nome del file sulla riga di comando'],[kb('Alt-P','Alt-N'),'cronologia dei comandi']])+`<h3>Mouse</h3><p>Clic seleziona, doppio clic apre, tasto destro marca o smarca, la rotella scorre.</p><h3>Telefono e tablet</h3><p>Si vede un pannello alla volta: il tasto <b>⇥ Tab</b> nella barra in basso passa all'altro. Tocco seleziona, doppio tocco apre, pressione lunga marca.</p>`},
{id:'select',t:'Selezionare i file',b:`<p>Quasi tutte le operazioni (copia, spostamento, cancellazione, archivi, rinomina in blocco) lavorano sui file <b>marcati</b>. Se non ce ne sono, lavorano sul file sotto il cursore.</p>`+tbl([[kb('Ctrl-T')+' o '+kb('Ins'),'marca o smarca il file e scende al successivo'],[kb('+'),'marca per gruppo: wildcard come <code>*.pdf</code> o una regex fra barre come <code>/^report_\\d+/i</code>'],[kb('\\'),'smarca per gruppo, con gli stessi modelli'],[kb('*'),'inverte la selezione'],['tasto destro','marca o smarca con il mouse']])+`<p>${kb('+')}, ${kb('\\')} e ${kb('*')} funzionano solo a riga di comando vuota, e i gruppi riguardano i file, non le cartelle. Sui Mac senza tasto Ins usa ${kb('Ctrl-T')}.</p><h3>Esempio: zippare alcuni file</h3><ol><li>marca i file con ${kb('Ctrl-T')} (o tutti i PDF con ${kb('+')} e <code>*.pdf</code>);</li><li>premi ${kb('Ctrl-X')} e poi ${kb('p')};</li><li>scrivi un nome che finisce in <code>.zip</code> e premi Invio.</li></ol><p>Vedi anche ${L_('archives','Archivi')}.</p>`},
{id:'fileops',t:'Copiare, spostare, cancellare',b:tbl([[kb('F5'),'copia. La destinazione proposta è la cartella dell\'altro pannello. Le cartelle vengono copiate con tutto il contenuto.'],[kb('F6'),'sposta o rinomina. Per rinominare, nella destinazione scrivi il nuovo nome nella stessa cartella.'],[kb('F7'),'crea una cartella'],[kb('F8'),'cancella: sul disco vero sposta nel Cestino di sistema, sul disco demo cancella per sempre'],[kb('Shift-F4'),'crea un file nuovo e lo apre nell\'editor']])+`<p>Se una destinazione finisce con <code>/</code> è trattata come cartella. Con più file marcati la destinazione deve essere una cartella esistente.</p><p>Se un file esiste già, l'app chiede: <b>Overwrite</b> (sovrascrivi questo), <b>All</b> (sovrascrivi tutti), <b>Skip</b> (salta), <b>Abort</b> (fermati). Le cartelle non vengono mai sovrascritte da uno spostamento.</p><p>Per molti file con nomi da cambiare secondo una regola vedi ${L_('batch','Rinomina in blocco')}.</p>`},
{id:'viewer',t:'Visualizzatore (F3)',b:`<p>${kb('F3')} mostra il file sotto il cursore: testo (con ${L_('editor','evidenziazione della sintassi')} per il codice), anteprima per immagini e documenti, oppure esadecimale per i file binari.</p>`+tbl([[kb('F2'),'testo: manda a capo le righe lunghe; esadecimale: attiva la modifica'],[kb('F4'),'passa all\'esadecimale e torna indietro'],[kb('F5'),'vai a: in esadecimale un offset (<code>0x1F</code>, <code>31</code> o <code>50%</code>), nel testo una riga o una percentuale'],[kb('F7'),'cerca testo, oppure byte esadecimali come <code>ff d8 ff</code>'],[kb('F8'),'per immagini e documenti: passa dall\'anteprima al contenuto grezzo'],[kb('F3')+' '+kb('F10')+' '+kb('Esc')+' '+kb('q'),'esce']])+`<h3>Anteprime</h3><ul><li>immagini: png, jpg, gif, webp, svg, bmp, ico, avif, tif/tiff;</li><li>PDF: fino a 60 pagine;</li><li>documenti: docx, odt, ods, odp (testo, titoli, elenchi e tabelle);</li><li>audio e video: mp3, wav, ogg, m4a, flac, mp4, webm, mov (dipende da cosa sa riprodurre il sistema).</li></ul><p>Il visualizzatore apre file fino a 16 MB. Per file più grandi, sul disco vero, ${kb('Invio')} li apre nella loro app.</p>`},
{id:'hex',t:'Editor esadecimale',b:`<p>Come in MC, l'editor esadecimale è dentro il visualizzatore: ${kb('F3')}, poi ${kb('F4')} per l'esadecimale, poi ${kb('F2')} per modificare.</p>`+tbl([['cifre 0–9 a–f','sovrascrivono il byte sotto il cursore, mezzo byte alla volta'],[kb('Tab'),'passa dalla colonna esadecimale a quella del testo, dove scrivi caratteri'],[kb('←','→','↑','↓'),'muovono il cursore di un byte o di una riga'],[kb('Home','End'),'inizio o fine della riga; con Ctrl inizio o fine del file'],[kb('PgUp','PgDn'),'una pagina'],[kb('F6'),'salva'],[kb('F2'),'torna alla sola lettura'],[kb('F5','F7'),'vai a offset, cerca']])+`<p>I byte modificati sono in rosso. Il clic su un byte ci sposta il cursore. L'editor sovrascrive soltanto: non inserisce e non toglie byte. Se esci con modifiche non salvate, l'app chiede se salvarle. I file dentro un archivio o in un branch Git sfogliato sono in sola lettura.</p>`},
{id:'editor',t:'Editor (F4) ed evidenziazione',b:tbl([[kb('F2')+' o '+kb('Ctrl-S'),'salva'],[kb('F10')+' o '+kb('Esc'),'esce; se ci sono modifiche chiede Yes, No o Cancel'],[kb('Tab'),'inserisce un carattere di tabulazione'],[kb('Shift-F4'),'crea un file nuovo']])+`<p>La riga in alto mostra percorso, linguaggio, <code>[-M--]</code> se ci sono modifiche, riga e colonna del cursore, dimensione.</p><p>L'editor apre file di testo fino a 2 MB; i file binari li rifiuta (usa ${L_('hex','l\'editor esadecimale')}). Gli a capo in stile Windows (CRLF) e il BOM iniziale restano come erano.</p><h3>Evidenziazione della sintassi</h3><p>Funziona nel visualizzatore, nell'editor e nella ${L_('quick','Quick view')} per circa 35 linguaggi riconosciuti dall'estensione: JavaScript, TypeScript, Python, Go, Rust, Java, C/C++, C#, PHP, Ruby, Swift, Kotlin, shell, SQL, HTML/XML, CSS, JSON, YAML, Markdown e altri. I colori seguono lo schema scelto in Options › Skin. Si spegne da Options › Syntax highlighting. Nell'editor si ferma oltre i 200 KB, nel visualizzatore oltre 1 MB.</p>`},
{id:'quick',t:'Quick view',b:`<p>${kb('Ctrl-X')} poi ${kb('q')} (oppure Left/Right › Quick view) trasforma l'altro pannello in un'anteprima del file sotto il cursore. Spostandoti fra i file l'anteprima si aggiorna.</p><ul><li>testo: i primi 64 KB, con evidenziazione;</li><li>immagini, PDF (prime 2 pagine), documenti, audio e video: come nel ${L_('viewer','visualizzatore')};</li><li>cartelle: numero di file e cartelle, peso, elenco dei nomi;</li><li>altri file binari: dump esadecimale dei primi 4 KB.</li></ul><p>Mentre la Quick view è attiva, ${kb('Tab')} non passa all'altro pannello. Si chiude con lo stesso comando.</p>`},
{id:'batch',t:'Rinomina in blocco',b:`<p>${kb('Ctrl-X')} poi ${kb('r')}, oppure File › Batch rename…. Lavora sui file marcati o, se non ce ne sono, su tutto il pannello. L'anteprima mostra il nome vecchio e quello nuovo mentre scrivi, e segna in rosso i conflitti: nomi doppi, file già esistenti, nomi non validi. Finché ci sono conflitti, Rename non procede.</p>`+tbl([['<b>Find</b>','espressione regolare JavaScript. Vuota significa “tutto il nome”.'],['<b>Replace with</b>','<code>$1</code> <code>$2</code>… gruppi catturati, <code>$&amp;</code> tutta la parte trovata, <code>{n}</code> contatore, <code>{n:3}</code> contatore a 3 cifre, <code>{name}</code> nome originale, <code>{ext}</code> estensione, <code>{date}</code> data di modifica (AAAA-MM-GG)'],['Keep extension','lavora solo sul nome e lascia l\'estensione com\'è (attivo di partenza)'],['Ignore case','la regex ignora maiuscole e minuscole'],['All matches','sostituisce tutte le occorrenze, non solo la prima'],['Case','dopo la sostituzione: keep, lower, UPPER, Title'],['{n} from, step','valore di partenza e passo del contatore, nell\'ordine del pannello']])+`<h3>Esempi</h3>`+`<table><tr><td><b>Find</b></td><td><b>Replace with</b></td><td><b>Prima → dopo</b></td></tr>`+[['(vuoto)','<code>foto_{n:3}</code>','IMG_2231.jpg → foto_001.jpg'],['<code>\\s+</code>','<code>_</code>','mio file.txt → mio_file.txt'],['<code>^(\\d{4})-(\\d{2})-(\\d{2})</code>','<code>$3.$2.$1</code>','2026-11-26 note → 26.11.2026 note'],['<code>^</code>','<code>{date}_</code>','report.pdf → 2026-11-20_report.pdf'],['(vuoto), Case: lower','(vuoto)','README.MD → readme.MD (con Keep extension)']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')+`</table><p>Gli scambi (a→b e b→a, oppure 1→2 e 2→3) funzionano: l'app passa per nomi temporanei. File › Undo batch rename riporta i nomi di prima dell'ultima rinomina in blocco.</p>`},
{id:'compare',t:'Confronto cartelle',b:`<p>${kb('Ctrl-X')} poi ${kb('d')}, oppure Command › Compare directories. Confronta i file con lo stesso nome nei due pannelli e marca quelli che mancano dall'altra parte o che sono diversi.</p>`+tbl([['Quick','dimensione e data; se differiscono marca il più recente'],['Size only','solo la dimensione; marca entrambi'],['Thorough','byte per byte (file fino a 64 MB)']])+`<p>Poi ${kb('F5')} copia i file marcati nell'altro pannello. Le sottocartelle non vengono confrontate.</p>`},
{id:'archives',t:'Archivi: tar, tgz, zip',b:tbl([[kb('Invio')+' su un archivio','ci entra come in una cartella, in sola lettura: .tar, .tgz, .tar.gz, .zip, .jar fino a 256 MB'],[kb('F3'),'dentro l\'archivio visualizza un file'],[kb('F5'),'dentro l\'archivio estrae i file marcati nell\'altro pannello'],[kb('Ctrl-X')+' '+kb('p'),'crea un archivio dai file marcati; il formato dipende dal nome: .tgz, .tar.gz, .tar o .zip'],[kb('Ctrl-X')+' '+kb('u'),'estrae tutto l\'archivio sotto il cursore, di partenza in una cartella con il suo nome nell\'altro pannello'],['..','in cima all\'archivio torna alla cartella vera']])+`<p>Il titolo del pannello mostra <code>⌸ nome.tgz:/percorso (archive)</code>. Dentro un archivio non si può scrivere. Un singolo archivio creato dall'app contiene al massimo 512 MB.</p><p>Nella console del disco demo c'è anche <code>tar</code>: <code>tar -czf out.tgz file…</code>, <code>tar -xzf in.tgz -C cartella</code>, <code>tar -tvf in.tar</code>. Sul disco vero <code>tar</code> è quello del sistema.</p>`},
{id:'git',t:'Git',b:`<p>Solo sul disco vero, e serve <code>git</code> installato sul computer. Quando entri in una cartella che fa parte di un repository:</p><ul><li>il titolo del pannello mostra il branch attuale (⎇ main);</li><li>i file hanno davanti lo stato (vedi ${L_('screen','Lo schermo')}); i modificati sono colorati, i non tracciati in corsivo;</li><li>la riga di stato del pannello dice “git: modified”, “untracked” e così via.</li></ul>`+tbl([[kb('Ctrl-X')+' '+kb('g'),'elenco dei branch locali e remoti, dal più recente. ● è il branch attuale, ◆ quello che stai sfogliando'],['Browse','sfoglia il branch scelto in sola lettura senza cambiare nulla sul disco: F3 visualizza, F5 copia file fuori, la Quick view funziona'],['Checkout','cambia il branch della copia di lavoro, dopo una conferma. Git rifiuta se ci sono modifiche locali che andrebbero perse; il messaggio di Git compare in una finestra'],[kb('Ctrl-X')+' '+kb('l'),'log degli ultimi 200 commit del file o della cartella sotto il cursore (del branch sfogliato, se ne stai sfogliando uno)']])+`<p>Per uscire dalla vista di un branch: ${kb('Ctrl-X')} ${kb('g')} › <b>Back to the working tree</b>, oppure sali sopra la radice del repository.</p>`},
{id:'cmdline',t:'Riga di comando e console',b:`<p>Puoi scrivere in qualunque momento: i caratteri vanno sulla riga di comando in basso. ${kb('Invio')} esegue. A riga vuota ${kb('Invio')} apre il file sotto il cursore.</p><h3>Comandi interni (sempre)</h3>`+tbl([['<code>cd</code> percorso','cambia la cartella del pannello attivo (<code>~</code> è la home, <code>..</code> sale)'],['<code>mkdir</code>, <code>touch</code>','crea cartelle o file vuoti'],['<code>cp</code>, <code>mv</code>','copia o sposta: l\'ultimo argomento è la destinazione'],['<code>rm</code>','cancella (passa dalla finestra di conferma; sul disco vero va nel Cestino)'],['<code>edit</code>, <code>vi</code>, <code>nano</code>','apre l\'editor; se il file non c\'è lo crea al salvataggio'],['<code>view</code>, <code>less</code>, <code>more</code>','apre il visualizzatore'],['<code>open</code>','apre nella sua app (disco vero)'],['<code>reveal</code>','mostra nel Finder o in Esplora risorse (disco vero)'],['<code>hidden</code>','mostra o nasconde i file nascosti'],['<code>man</code> [argomento]','apre questo manuale, per esempio <code>man git</code>']])+`<h3>Sul disco vero</h3><p>Ogni altro comando va alla tua shell vera, nella cartella del pannello attivo, e l'output compare nel ${L_('term','terminale')}. Attenzione: lì si può lanciare qualunque comando, anche quelli che cancellano file per sempre.</p><h3>Sul disco demo: la console</h3><p>Ci sono <code>ls</code> (-l -a -h -t -S -r), <code>cat</code> (-n), <code>head</code> e <code>tail</code> (-n N), <code>wc</code>, <code>grep</code> (-i -n -r -v -c -l), <code>find</code> (-name -iname -type f|d), <code>tree</code>, <code>du</code> (-s -h), <code>stat</code>, <code>file</code>, <code>echo</code>, <code>pwd</code>, <code>history</code>, <code>clear</code>, <code>rmdir</code>, <code>tar</code>, <code>help</code>. L'output compare in una console a tutto schermo, che si apre da sola o con ${kb('Ctrl-O')}.</p><ul><li><code>*</code> e <code>?</code> si espandono; le virgolette proteggono gli spazi;</li><li><code>comando &gt; file</code> scrive l'output in un file, <code>&gt;&gt;</code> lo aggiunge in fondo;</li><li>nella console: ${kb('Tab')} completa i nomi, ${kb('↑','↓')} richiamano i comandi, ${kb('Ctrl-L')} pulisce, ${kb('Ctrl-O')} o ${kb('F10')} tornano ai pannelli;</li><li>le pipe (<code>|</code>) non ci sono.</li></ul>`},
{id:'term',t:'Terminale (Ctrl-O)',b:`<p>Sul disco vero ${kb('Ctrl-O')} nasconde i pannelli e mostra la tua shell vera: quella predefinita del Mac o di Linux, PowerShell su Windows. La prima volta parte nella cartella del pannello attivo. ${kb('Ctrl-O')} o ${kb('F10')} tornano ai pannelli, che vengono riletti.</p><p>Quando scrivi un comando non interno nella riga di comando, l'app lo manda alla shell preceduto da un <code>cd</code> nella cartella del pannello. Se la shell termina (per esempio con <code>exit</code>), ${kb('Invio')} ne apre una nuova.</p><p>Passando con ${kb('Ctrl-O')}, la shell non segue da sola la cartella del pannello: se nel terminale fosse aperto un programma come vim o htop, il comando <code>cd</code> finirebbe scritto dentro quel programma.</p><p>Sul disco demo ${kb('Ctrl-O')} apre la ${L_('cmdline','console')}.</p>`},
{id:'menus',t:'Menu e opzioni',b:tbl([['<b>Left / Right</b>','ordinamento per nome, dimensione o data; ordine inverso; Quick view; Rescan; Home directory'],['<b>File</b>','View, Edit, New file, Copy, Rename/Move, Mkdir, Delete, Pack, Unpack, Batch rename, Undo batch rename, Select/Unselect group, Invert selection, Quit'],['<b>Command</b>','Terminal, Compare directories, Git branches, Git log, Swap panels, Same dir in other panel, Open in its app, Reveal in Finder/Explorer, e l\'eventuale installazione o permesso dell\'app desktop'],['<b>Options</b>','Skin…, Syntax highlighting, Show hidden files'],[kb('F2'),'menu rapido sul file sotto il cursore: View, Edit, Open, Reveal, Pack, Unpack, nome sulla riga di comando, stessa cartella nell\'altro pannello']])+`<p>Nei menu: ${kb('←','→')} cambiano menu, ${kb('↑','↓')} scelgono, ${kb('Invio')} esegue, ${kb('Esc')} chiude.</p><h3>Skin</h3><p>Options › Skin…: Midnight Commander (classico blu), Nightglass, Eclipse, Eclipse Dark, Dracula, Neon (Synthwave), Monokai, Solarized Dark, Solarized Light, Nord, One Dark, Gruvbox Dark. La skin colora anche il terminale e il codice, e resta salvata.</p>`},
{id:'keys',t:'Tutte le scorciatoie',b:`<h3>Pannelli</h3>`+tbl([[kb('F1'),'manuale'],[kb('F2'),'menu rapido del file'],[kb('F3'),'visualizza'],[kb('F4'),'modifica'],[kb('Shift-F4'),'file nuovo'],[kb('F5'),'copia'],[kb('F6'),'sposta o rinomina'],[kb('F7'),'nuova cartella'],[kb('F8'),'cancella (Cestino sul disco vero)'],[kb('F9'),'menu'],[kb('F10'),'esci (sul disco vero nasconde la finestra)'],[kb('Tab'),'altro pannello'],[kb('Ctrl-T')+' '+kb('Ins'),'marca'],[kb('+')+' '+kb('\\')+' '+kb('*'),'marca, smarca, inverti per gruppo'],[kb('Ctrl-R'),'rileggi'],[kb('Ctrl-U'),'scambia pannelli'],[kb('Alt-I'),'stessa cartella nell\'altro pannello'],[kb('Alt-Invio'),'nome sulla riga di comando'],[kb('Alt-P')+' '+kb('Alt-N'),'cronologia comandi'],[kb('Ctrl-O'),'terminale o console'],[kb('Ctrl-X')+' '+kb('d'),'confronta cartelle'],[kb('Ctrl-X')+' '+kb('r'),'rinomina in blocco'],[kb('Ctrl-X')+' '+kb('q'),'Quick view'],[kb('Ctrl-X')+' '+kb('p'),'crea archivio'],[kb('Ctrl-X')+' '+kb('u'),'estrai archivio'],[kb('Ctrl-X')+' '+kb('g'),'branch Git'],[kb('Ctrl-X')+' '+kb('l'),'log Git']])+`<h3>Visualizzatore</h3>`+tbl([[kb('F2'),'a capo / modifica esadecimale'],[kb('F4'),'esadecimale'],[kb('F5'),'vai a'],[kb('F6'),'salva (esadecimale)'],[kb('F7'),'cerca'],[kb('F8'),'anteprima / grezzo'],[kb('F10')+' '+kb('Esc')+' '+kb('q'),'esci']])+`<h3>Editor</h3>`+tbl([[kb('F2')+' '+kb('Ctrl-S'),'salva'],[kb('F10')+' '+kb('Esc'),'esci']])+`<p>Se il browser si prende un tasto funzione, premi ${kb('Esc')} e poi la cifra: ${kb('Esc')} ${kb('5')} equivale a ${kb('F5')}, ${kb('Esc')} ${kb('0')} a ${kb('F10')}.</p>`},
{id:'limits',t:'Limiti e note',b:`<ul><li>Visualizzatore fino a 16 MB, editor fino a 2 MB, archivi da sfogliare fino a 256 MB, archivi da creare fino a 512 MB.</li><li>In cartelle con più di 1500 elementi, dimensione e data compaiono solo per i primi 1500.</li><li>L'editor esadecimale sovrascrive e basta: non inserisce né toglie byte.</li><li>La console del disco demo non ha pipe; sul disco vero ogni comando non interno va alla shell vera.</li><li>Git e terminale funzionano solo nell'app desktop, con l'accesso completo.</li><li>Il Cestino è quello di sistema: alcuni dischi di rete non ne hanno uno, e in quel caso F8 dà errore invece di cancellare.</li><li>Le anteprime di documenti (docx, odt) mostrano testo, titoli, elenchi e tabelle, non l'impaginazione esatta.</li><li>Ogni nuova versione dell'app desktop richiede di nuovo il permesso di accesso completo.</li></ul>`}
];
MAN.find(s=>s.id==='index').b=MAN.find(s=>s.id==='index').b.replace(/data-h="(\w+)"><\/button>/g,(m,id)=>`data-h="${id}">${MAN.find(s=>s.id===id).t}</button>`);
let manS={cur:'index',stack:[],prev:'panels'};
function openMan(id){
 if(mode!=='man'){manS.prev=mode;manS.stack=[]}
 mode='man';document.body.classList.add('man');closeMenu();
 $('#mantoc').innerHTML=MAN.map(s=>`<button data-h="${s.id}">${esc(s.t)}</button>`).join('');
 manGo(MAN.some(s=>s.id===id)?id:'index',true);fnbar();
}
function manGo(id,noPush){
 if(!noPush&&manS.cur&&manS.cur!==id)manS.stack.push(manS.cur);
 const s=MAN.find(x=>x.id===id)||MAN[0];manS.cur=s.id;
 $('#manb').innerHTML=`<h2>${esc(s.t)}</h2>${s.b}`;$('#manb').scrollTop=0;
 $('#mant').textContent=`Manuale · ${s.t}`;
 document.querySelectorAll('#mantoc [data-h]').forEach(b=>b.classList.toggle('on',b.dataset.h===s.id));
 const q=$('#manq');if(q&&document.activeElement!==q)$('#manb').focus();
}
function manBack(){const p=manS.stack.pop();if(p)manGo(p,true)}
function manSearch(q){
 q=q.trim().toLowerCase();if(q.length<2){manGo(manS.cur,true);return}
 const strip=h=>h.replace(/<[^>]+>/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/\s+/g,' ');
 const hits=MAN.map(s=>{const t=strip(s.b),i=t.toLowerCase().indexOf(q);return {s,i,t,n:(t.toLowerCase().split(q).length-1)+(s.t.toLowerCase().includes(q)?5:0)}}).filter(h=>h.n>0).sort((a,b)=>b.n-a.n);
 $('#mant').textContent=`Manuale · ricerca “${q}”`;
 $('#manb').innerHTML=`<h2>Risultati per “${esc(q)}”</h2>`+(hits.length?`<ul>${hits.map(h=>{const a=Math.max(0,h.i-50),sn=h.i>=0?(a?'…':'')+h.t.slice(a,h.i+q.length+70)+'…':'';return `<li><button class="lk" data-h="${h.s.id}">${esc(h.s.t)}</button><br><span class="sn">${esc(sn)}</span></li>`}).join('')}</ul>`:'<p>Nessun risultato.</p>');
}
function closeMan(){document.body.classList.remove('man');mode=manS.prev||'panels';fnbar();if(mode==='view')$('#ovb').focus();else if(mode==='edit'&&$('#ed'))$('#ed').focus();else focusCmd()}
$('#manq').addEventListener('input',e=>manSearch(e.target.value));
function help(){openMan(mode==='view'?(V&&V.mode==='hex'?'hex':'viewer'):mode==='edit'?'editor':mode==='con'?'cmdline':'index')}

 if(i>=0){const t=toks[i].t,app=t.startsWith('>>'),inl=t.replace(/^>>?/,'');const target=inl||(toks[i+1]&&toks[i+1].t);if(!target)return oe('syntax error near ">"');red={p:abs(target),app};toks=toks.slice(0,i)}
 const args=await expand(toks);
 if(red)OUT=[];
 try{await CMDS[c](args)}catch(e){oe(`${c}: ${nice(e)}`)}
 if(red){const lines=OUT;OUT=null;try{let pre='';if(red.app){const s=await B.stat(red.p);if(s){const x=await readText(red.p);pre=x||''}}await B.write(red.p,pre+(lines.length?lines.join('\n')+'\n':''));await reloadBoth()}catch(e){oe(`${c}: cannot write ${shortP(red.p)}: ${nice(e)}`)}}
}
async function runCmd(line){
 line=line.trim();if(!line)return;
 if(CON.hist[CON.hist.length-1]!==line)CON.hist.push(line);CON.hi=CON.hist.length;
 const toks=tokens(line),c=toks[0].t,a=toks.slice(1).map(x=>x.t),arg=a.join(' '),p=AP();
 if(!live())say(promptStr()+line,'c');
 const fail=msg=>mode==='con'||!live()&&mode!=='panels'?oe(msg):err(c,msg);
 const st=async(x,want)=>{const t=abs(x),s=await B.stat(t);if(!s){fail(`${x}: No such file or directory`);return null}if(want==='dir'&&!s.dir){fail(`${x}: Not a directory`);return null}if(want==='file'&&s.dir){fail(`${x}: Is a directory`);return null}return s};
 try{
 switch(c){
  case 'cd':{const s=await st(arg||'~','dir');if(s)await cd(p,s.path);if(mode==='con')setPrompt();return}
  case 'mkdir':case 'touch':{if(!arg)return fail('Missing name');const ex=await expand(toks.slice(1));for(const n of ex){const t=abs(n);if(badName(base(t))){fail(`${n}: Invalid name`);continue}if(c==='touch'&&await B.exists(t))continue;await(c==='mkdir'?B.mkdir(t):B.touch(t))}await reloadBoth();return}
  case 'edit':case 'mcedit':case 'vi':case 'vim':case 'nano':{if(!arg)return newFileDlg();const t=abs(arg),s=await B.stat(t);if(s&&s.dir)return fail('Is a directory');if(s)await edit(s);else openEditor(t,{text:'',crlf:false,bom:false},true);return}
  case 'view':case 'less':case 'more':{const s=await st(arg,'file');if(s)await view(s);return}
  case 'cp':case 'mv':{const ex=await expand(toks.slice(1));if(ex.length<2)return fail(`Usage: ${c} <source>… <destination>`);const dst=abs(ex[ex.length-1]),ds=await B.stat(dst),src=ex.slice(0,-1);if(src.length>1&&!(ds&&ds.dir))return fail('Destination must be a directory');for(const sname of src){const s=await st(sname);if(!s)continue;const t=ds&&ds.dir?join(dst,s.name):dst;if(await B.exists(t)){fail(`${shortP(t)}: File exists`);continue}if(c==='mv')await B.rename(s.path,t);else await copyTree(s.path,t,async()=>'skip')}await reloadBoth();return}
  case 'rm':case 'del':{const ex=await expand(toks.slice(1).filter(x=>!/^-[rRf]+$/.test(x.t)));const l=[];for(const n of ex){const s=await st(n);if(s)l.push(s)}if(l.length)await del(l);return}
  case 'open':{const s=await st(arg||'.');if(!s)return;if(s.dir)await cd(p,s.path);else if(live())await Live.open(s.path);else await view(s);return}
  case 'reveal':{if(!live())return fail('reveal works only on the real disk');const s=await st(arg||'.');if(s)await Live.reveal(s.path);return}
  case 'hidden':toggleHidden();return;
  case 'man':{const q=arg.toLowerCase(),s=q&&(MAN.find(x=>x.id===q)||MAN.find(x=>x.t.toLowerCase().includes(q)));openMan(s?s.id:'index');if(q&&!s){$('#manq').value=arg;manSearch(arg)}return}
  case 'exit':case 'quit':return mode==='con'?closeCon():quit();
 }
 if(live())return openTerm(line);
 if(CMDS[c]){await runCon(c,toks.slice(1));openCon();return}

 }catch(e){fail(`${nice(e)}\n${String(e.message||e)}`)}
}
async function completeCmd(){const el=$('#cmd'),v=el.value,m=v.match(/^(.*?\s)?(\S*)$/);if(!m||!m[1])return;const w=m[2],dirPart=w.includes('/')?w.slice(0,w.lastIndexOf('/')+1):'',pre=w.slice(dirPart.length);let l;try{l=await B.list(abs(dirPart||'.'))}catch(e){return}const c=l.filter(x=>x.name.startsWith(pre)&&(pre.startsWith('.')||!x.name.startsWith('.')));if(!c.length)return;if(c.length===1){const x=c[0],n=/\s/.test(x.name)?`"${dirPart}${x.name}"`:dirPart+x.name;el.value=m[1]+n+(x.dir?'/':' ');return}let cp=c[0].name;for(const x of c)while(!x.name.startsWith(cp))cp=cp.slice(0,-1);if(cp.length>pre.length){el.value=m[1]+dirPart+cp;return}say(promptStr()+v,'c');columns(c.map(x=>x.name+(x.dir?'/':'')));openCon()}

 pty.onError(e=>{T.alive=false;T.term.write(`\r\n[cannot start the shell: ${String(e&&e.message||e)}]\r\n`)});
}
async function openTerm(line){
 if(!live())return err('Subshell','The terminal runs only in the desktop app, on your real disk.\nInstall this artifact as an app from the Claude desktop app.');
 mode='term';document.body.classList.add('term');closeMenu();fnbar();
 try{
  if(!T){
   if(!window.Terminal)await loadScript('vendor/xterm.js');
   if(!window.FitAddon)await loadScript('vendor/addon-fit.js');
   const term=new window.Terminal({fontFamily:getComputedStyle(document.body).getPropertyValue('--font'),fontSize:15,cursorBlink:true,scrollback:5000,theme:termTheme()});
   const fit=new window.FitAddon.FitAddon();term.loadAddon(fit);term.open($('#tm'));
   term.attachCustomKeyEventHandler(e=>!((e.ctrlKey||e.metaKey)&&!e.altKey&&e.key.toLowerCase()==='o'));
   term.onData(d=>{if(T.pty&&T.alive)T.pty.write(d).catch(()=>{});else if(d==='\r')spawnShell()});
   T={term,fit,pty:null,alive:false};
   const tro=new ResizeObserver(()=>{if(mode==='term')fitTerm()});tro.observe($('#tm'));
  }

 }catch(e){closeTerm();err('Subshell',`Cannot open the terminal\n${nice(e)}`)}

/* ---------- compare directories (C-x d) ---------- */
async function compareDirs(){
 const r=await dlg({title:'Compare directories',lines:['Select compare method:','Quick: size and date.  Size only: size.  Thorough: byte by byte.'],buttons:['Quick','Size only','Thorough','Cancel']});
 if(!r||r.b===3)return;
 const [a,b]=P;a.tag.clear();b.tag.clear();
 const fa=new Map(a.list.filter(x=>!x.dir).map(x=>[x.name,x])),fb=new Map(b.list.filter(x=>!x.dir).map(x=>[x.name,x]));
 const newer=(x,y,pa,pb)=>{const d=(x.mtime||0)-(y.mtime||0);if(d>1000)pa.tag.add(x.path);else if(d<-1000)pb.tag.add(y.path);else{pa.tag.add(x.path);pb.tag.add(y.path)}};
 let k=0;
 for(const [n,x] of fa){
  const y=fb.get(n);if(!y){a.tag.add(x.path);continue}
  if(r.b===1){if(x.size!==y.size){a.tag.add(x.path);b.tag.add(y.path)}continue}
  if(x.size!==y.size){newer(x,y,a,b);continue}
  if(r.b===0){if(Math.abs((x.mtime||0)-(y.mtime||0))>1000)newer(x,y,a,b);continue}
  if(x.size>64*1048576){newer(x,y,a,b);continue}
  hint(`Comparing ${n} (${++k})`);
  try{const [u,v]=await Promise.all([FS(a).readBytes(x.path),FS(b).readBytes(y.path)]);let same=u.length===v.length;for(let i=0;same&&i<u.length;i++)if(u[i]!==v[i])same=false;if(!same)newer(x,y,a,b)}catch(e){a.tag.add(x.path);b.tag.add(y.path)}
 }
 for(const [n,y] of fb)if(!fa.has(n))b.tag.add(y.path);
 render(a);render(b);
 hint(a.tag.size||b.tag.size?`Different or missing: ${a.tag.size} marked left, ${b.tag.size} marked right. F5 copies them across.`:'The directories are identical.');
}

/* ---------- batch rename (C-x r) ---------- */
async function applyRenames(dir,pairs){
 const lo=s=>s.toLowerCase(),srcs=new Set(pairs.map(r=>lo(r.from))),done=[];
 if(!pairs.some(r=>srcs.has(lo(r.to)))){
  for(const r of pairs){try{hint('Renaming '+r.from);await B.rename(join(dir,r.from),join(dir,r.to));done.push(r)}catch(e){return {done,e}}}
  return {done};
 }
 const st=Date.now().toString(36),tm=pairs.map((r,i)=>({...r,tmp:`.ng-batch-${st}-${i}`}));let k=0;
 try{for(;k<tm.length;k++)await B.rename(join(dir,tm[k].from),join(dir,tm[k].tmp))}
 catch(e){for(let j=k-1;j>=0;j--)try{await B.rename(join(dir,tm[j].tmp),join(dir,tm[j].from))}catch(_){}return {done,e}}
 for(let j=0;j<tm.length;j++){
  try{await B.rename(join(dir,tm[j].tmp),join(dir,tm[j].to));done.push(tm[j])}
  catch(e){const left=[];for(let m=j;m<tm.length;m++){try{await B.rename(join(dir,tm[m].tmp),join(dir,tm[m].from))}catch(_){left.push(tm[m].tmp+' (was '+tm[m].from+')')}}return {done,e,left}}
 }
 return {done};
}
async function runBatch(dir,pairs,label){
 const r=await applyRenames(dir,pairs);
 if(r.done.length)lastBatch={dir,pairs:r.done.map(x=>({from:x.from,to:x.to}))};
 P.forEach(p=>p.tag.clear());await reloadBoth();
 if(r.e)return err(label,`Stopped after ${r.done.length} of ${pairs.length}:\n${nice(r.e)}`+(r.left&&r.left.length?`\nLeft with temporary names:\n${r.left.join('\n')}`:''));
 hint(`${label}: ${r.done.length} renamed. File > Undo batch rename reverts it.`);
}
async function undoBatch(){
 if(!lastBatch)return;const b=lastBatch;
 const q=await dlg({title:'Undo batch rename',lines:[`Give back the old names to ${b.pairs.length} entries in`,shortP(b.dir)],buttons:['Yes','No']});
 if(!q||q.b!==0)return;lastBatch=null;
 await runBatch(b.dir,b.pairs.map(x=>({from:x.to,to:x.from})),'Undo batch rename');lastBatch=null;
}
async function batchRename(){
 if(roGuard('Batch rename'))return;
 const p=AP(),dir=p.path,items=p.tag.size?p.list.filter(x=>p.tag.has(x.path)):p.list.filter(x=>!x.up);
 if(!items.length)return err('Batch rename','Nothing to rename here.');
 if(dRes)dRes(null);
 const w=$('#dw'),scope=p.tag.size?`${items.length} marked entries`:`all ${items.length} entries`;
 w.innerHTML=`<form class="dlg wide"><div class="fr"><div class="dt"> Batch rename </div>
<p>Renaming ${esc(scope)} in ${esc(shortP(dir))}</p>
<label class="fl">Find (regular expression; empty means the whole name)<input id="bf" type="text" autocomplete="off" spellcheck="false"></label>
<label class="fl">Replace with ($1 $2 … groups, {n} counter, {n:3} zero-padded, {name} {ext} {date})<input id="br" type="text" autocomplete="off" spellcheck="false"></label>
<div class="opts"><label><input type="checkbox" id="bx" checked>Keep extension</label><label><input type="checkbox" id="bi">Ignore case</label><label><input type="checkbox" id="bg" checked>All matches</label><label>Case<select id="bc"><option value="">keep</option><option value="l">lower</option><option value="u">UPPER</option><option value="t">Title</option></select></label><label>{n} from<input id="bs" class="num" type="text" value="1"></label><label>step<input id="bt" class="num" type="text" value="1"></label></div>
<div class="prev" id="bp"></div><p id="bm"></p>
<div class="db"><button type="submit" id="bgo">[< Rename >]</button><button type="button" data-b="1">[ Cancel ]</button></div></div></form>`;
 w.className='on';
 let cur=null;
 const plan=()=>{
  const f=$('#bf').value,rep=$('#br').value,keep=$('#bx').checked,cs=$('#bc').value,st=parseInt($('#bs').value,10),step=parseInt($('#bt').value,10);
  let re=null;if(f){try{re=new RegExp(f,($('#bi').checked?'i':'')+($('#bg').checked?'g':''))}catch(e){return {bad:'Bad regular expression: '+e.message}}}
  const rows=items.map((x,i)=>{
   let stem=x.name,ex='';if(keep&&!x.dir){const m=x.name.match(/^(.+?)(\.[^.]+)$/);if(m){stem=m[1];ex=m[2]}}
   const n=(isNaN(st)?1:st)+i*(isNaN(step)?1:step),d=x.mtime?new Date(x.mtime):null;
   const tok=(s,forRe)=>s.replace(/\{(n(?::(\d+))?|name|ext|date)\}/g,(m0,k2,pad)=>{const v=k2[0]==='n'&&k2!=='name'?String(n).padStart(+pad||0,'0'):k2==='name'?stem:k2==='ext'?(ex.slice(1)||ext(x.name)):d?`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`:'';return forRe?v.replace(/\$/g,'$$$$'):v});
   let out=re?stem.replace(re,tok(rep,true)):rep?tok(rep,false):stem;
   if(cs==='l')out=out.toLowerCase();else if(cs==='u')out=out.toUpperCase();else if(cs==='t')out=out.replace(/[^\s_\-.]+/g,w2=>w2[0].toUpperCase()+w2.slice(1).toLowerCase());
   return {from:x.name,to:out+ex};
  });
  const away=new Set(rows.filter(r=>r.to!==r.from).map(r=>r.from.toLowerCase()));
  const stay=new Set(p.ents.map(e=>e.name.toLowerCase()).filter(n2=>!away.has(n2)));
  const cnt=new Map();rows.forEach(r=>{const k2=r.to.toLowerCase();cnt.set(k2,(cnt.get(k2)||0)+1)});
  rows.forEach(r=>{const k2=r.to.toLowerCase();if(r.to===r.from)r.st='same';else if(badName(r.to))r.st='err',r.why='invalid name';else if(cnt.get(k2)>1)r.st='err',r.why='duplicate';else if(stay.has(k2)&&k2!==r.from.toLowerCase())r.st='err',r.why='already exists';else r.st='ok'});
  return {rows};
 };
 const show=()=>{
  cur=plan();const bp=$('#bp'),bm=$('#bm');
  if(cur.bad){bm.textContent=cur.bad;bp.innerHTML='';return}
  const ch=cur.rows.filter(r=>r.st==='ok').length,bad=cur.rows.filter(r=>r.st==='err').length;
  bp.innerHTML=cur.rows.slice(0,800).map(r=>`<div class="pr ${r.st}"><span>${esc(r.from)}</span><span> → </span><span>${esc(r.to)}</span><span>${r.st==='err'?esc(r.why):r.st==='same'?'unchanged':''}</span></div>`).join('')+(cur.rows.length>800?`<div class="pr same"><span>… ${cur.rows.length-800} more</span></div>`:'');
  bm.textContent=bad?`${bad} conflict${bad>1?'s':''}: fix them to enable Rename.`:ch?`${ch} will be renamed, ${cur.rows.length-ch} unchanged.`:'Nothing changes yet.';
 };
 w.querySelectorAll('input,select').forEach(el=>el.addEventListener(el.type==='checkbox'||el.tagName==='SELECT'?'change':'input',show));
 show();setTimeout(()=>$('#bf').focus(),10);
 const go=await new Promise(res=>{dRes=res;w.querySelector('form').addEventListener('submit',e=>{e.preventDefault();if(!cur||cur.bad||cur.rows.some(r=>r.st==='err')||!cur.rows.some(r=>r.st==='ok')){show();return}dClose({b:0,plan:cur})})});
 if(!go||go.b!==0)return;
 await runBatch(dir,go.plan.rows.filter(r=>r.st==='ok').map(r=>({from:r.from,to:r.to})),'Batch rename');
}

function drawIcon(){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');g.fillStyle='#0000a8';g.fillRect(0,0,256,256);g.fillStyle='#00a8a8';g.fillRect(0,0,256,26);g.fillRect(0,226,256,30);g.strokeStyle='#d0d0d0';g.lineWidth=4;[[12,40],[134,40]].forEach(([x,y])=>{g.strokeRect(x,y,110,174);g.strokeRect(x+7,y+7,96,160)});g.fillStyle='#00a8a8';g.fillRect(22,92,90,18);g.fillStyle='#fcfc54';g.fillRect(144,66,70,10);g.fillRect(144,118,52,10);g.fillStyle='#fff';[66,140,166].forEach(y=>g.fillRect(26,y,60,8));return c.toDataURL('image/png')}
async function appIcon(){try{const r=await fetch('icons/icon-512.png');if(!r.ok)throw 0;const b=await r.blob();return await new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(f.result);f.onerror=rej;f.readAsDataURL(b)})}catch(e){return drawIcon()}}
function setDesk(label,text,fn){deskAct=fn?{label,fn}:null;hint(text,deskAct)}
async function goLive(D){
 try{await Live.init(D)}catch(e){return setDesk('','Could not open your disk: '+String(e.message||e))}
 B=Live;deskAct=null;
 const L=prefs.liveL&&await Live.stat(prefs.liveL),R=prefs.liveR&&await Live.stat(prefs.liveR),docs=await Live.stat(join(B.home,'Documents'));
 P[0].path=L&&L.dir?L.path:B.home;P[1].path=R&&R.dir?R.path:docs&&docs.dir?docs.path:B.home;
 P.forEach(p=>{p.tag.clear();p.cur=0;p.top=0});
 await reloadBoth();renderAll();
 hint('LIVE DISK. Enter opens files in their app, F3 views, F4 edits, F8 moves to the system Trash.');

async function initDesktop(){
 let D=null;try{if(window.claude&&window.claude.use)D=await window.claude.use('desktop')}catch(e){}
 const demo='Demo drive with fictional files.';
 if(!D)return setDesk('',demo+' To browse your real disk, open this artifact in the Claude desktop app and install it as an app.');
 if(!D.fs){
  let st='unavailable';try{st=await D.install.state()}catch(e){}
  if(st==='available')return setDesk('Install as app',demo+' To browse your real disk:',async()=>{try{const r=await D.install.request();if(r==='installed')setDesk('','Installing. Open Nightglass from your Dock or Start menu, then grant full access.');else if(r==='failed')err('Install','Installation failed.')}catch(e){err('Install',nice(e))}});
  if(st==='installed')return setDesk('',demo+' Nightglass is installed: open it from your Dock or Start menu to browse your real disk.');
  return setDesk('',demo+' To browse your real disk, open this artifact in the Claude desktop app and install it as an app.');
 }
 appIcon().then(u=>D.app.dock.setIcon(u)).catch(()=>{});
 const check=async()=>{let st='unavailable';try{st=await D.permissions.state('full-access')}catch(e){}
  if(st==='granted')return goLive(D);
  if(st==='prompt')return setDesk('Grant full access','Demo drive. To browse the real files of this computer:',async()=>{try{await D.permissions.request(['full-access'])}catch(e){err('Permission',nice(e))}check()});
  if(st==='denied')return setDesk('Open permissions','Full access was refused, so this is still the demo drive.',async()=>{try{await D.permissions.manage()}catch(e){err('Permissions',nice(e))}check()});
  setDesk('Check again','Full disk access is not available right now (still signing in, another organization selected, or not allowed).',check);
 };
 check();
}
